<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpagina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #1e293b;
      background-image: radial-gradient(circle at 50% 30%, #334155 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      color: #ffffff;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin-bottom: 25px;
    }
    .search-form {
      display: flex;
      flex: 1;
      min-width: 280px;
      background: #ffffff;
      border-radius: 25px;
      padding: 4px 6px 4px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      color: #1e293b;
      background: transparent;
    }
    .search-button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.3); }
    .action-btn.active { background: #ef4444; border-color: #ef4444; }

    .webmix-board {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .tile-grid {
      display: grid;
      grid-template-columns: repeat(5, 85px);
      gap: 10px;
      justify-content: center;
    }
    @media (max-width: 520px) {
      .tile-grid { grid-template-columns: repeat(3, 85px); }
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 85px;
      height: 85px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      color: #1e293b;
      padding: 8px 6px 6px 6px;
      position: relative;
      transition: transform 0.18s ease-in-out, box-shadow 0.18s ease-in-out;
      overflow: hidden;
      cursor: pointer;
    }
    .tile:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }
    .tile img {
      width: 32px;
      height: 32px;
      margin-bottom: 6px;
      object-fit: contain;
      pointer-events: none;
    }
    .tile span {
      font-size: 0.68rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.15;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #334155;
      pointer-events: none;
    }

    body.edit-mode .tile {
      animation: shake 0.3s infinite alternate;
      border: 2px dashed #3b82f6;
    }
    @keyframes shake {
      0% { transform: rotate(-1deg); }
      100% { transform: rotate(1deg); }
    }
    .add-tile {
      background: rgba(255, 255, 255, 0.15);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .modal input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .btn-save { background: #22c55e; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-right: auto; }
    .btn-cancel { background: #64748b; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="top-bar">
    <form class="search-form" action="https://www.google.com/search" method="get" target="_blank">
      <input type="text" name="q" class="search-input" placeholder="Zoeken op Google..." aria-label="Zoeken">
      <button type="submit" class="search-button">Zoek</button>
    </form>
    <button id="toggle-edit" class="action-btn">✏️ Bewerken</button>
  </div>

  <main class="webmix-board">
    <nav class="tile-grid" id="tile-grid"></nav>
  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title" style="margin-bottom: 15px;">Blokje Bewerken</h2>
      <form id="tile-form">
        <input type="hidden" id="tile-id">
        <input type="text" id="tile-name" required placeholder="Naam (bijv. YouTube)">
        <input type="url" id="tile-url" required placeholder="URL (https://...)">
        <input type="url" id="tile-icon" placeholder="Icoon URL (optioneel)">
        <div class="modal-buttons">
          <button type="button" class="btn-delete" id="btn-delete">Verwijderen</button>
          <button type="button" class="btn-cancel" id="btn-cancel">Annuleren</button>
          <button type="submit" class="btn-save">Opslaan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const BIN_ID = '6a8ef503da38895dfe137a34';
    const API_KEY = '$2a$10$oOBz9UbuSP94u4C2ce71RuDqm5F5Aa5XJcte6qGJOF3sPqTWgF.ve';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let tiles = [];
    let isEditMode = false;

    const gridEl = document.getElementById('tile-grid');
    const toggleEditBtn = document.getElementById('toggle-edit');
    const modalOverlay = document.getElementById('modal-overlay');
    const tileForm = document.getElementById('tile-form');
    const btnCancel = document.getElementById('btn-cancel');
    const btnDelete = document.getElementById('btn-delete');

    async function loadTiles() {
      gridEl.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Laden...</p>';
      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        tiles = data.record;
        renderGrid();
      } catch (err) {
        gridEl.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Fout bij laden van data.</p>';
      }
    }

    async function syncToCloud() {
      try {
        await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': API_KEY
          },
          body: JSON.stringify(tiles)
        });
      } catch (err) {
        alert('Fout bij opslaan in de cloud!');
      }
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      tiles.forEach(tile => {
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = tile.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        
        const iconUrl = tile.icon || `https://www.google.com/s2/favicons?domain=${tile.url}&sz=64`;
        a.innerHTML = `<img src="${iconUrl}" alt="" loading="lazy"><span>${tile.name}</span>`;

        a.addEventListener('click', (e) => {
          if (isEditMode) {
            e.preventDefault();
            openModal(tile);
          }
        });
        gridEl.appendChild(a);
      });

      if (isEditMode) {
        const addBtn = document.createElement('div');
        addBtn.className = 'tile add-tile';
        addBtn.innerText = '+';
        addBtn.addEventListener('click', () => openModal());
        gridEl.appendChild(addBtn);
      }
    }

    function openModal(tile = null) {
      modalOverlay.classList.add('open');
      if (tile) {
        document.getElementById('modal-title').innerText = 'Blokje Bewerken';
        document.getElementById('tile-id').value = tile.id;
        document.getElementById('tile-name').value = tile.name;
        document.getElementById('tile-url').value = tile.url;
        document.getElementById('tile-icon').value = tile.icon || '';
        btnDelete.style.display = 'block';
      } else {
        document.getElementById('modal-title').innerText = 'Nieuw Blokje';
        document.getElementById('tile-id').value = '';
        tileForm.reset();
        btnDelete.style.display = 'none';
      }
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      tileForm.reset();
    }

    toggleEditBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      toggleEditBtn.classList.toggle('active', isEditMode);
      toggleEditBtn.innerText = isEditMode ? '✖️ Klaar' : '✏️ Bewerken';
      renderGrid();
    });

    tileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('tile-id').value;
      const name = document.getElementById('tile-name').value;
      const url = document.getElementById('tile-url').value;
      const icon = document.getElementById('tile-icon').value;

      if (id) {
        const tile = tiles.find(t => t.id === id);
        if (tile) {
          tile.name = name;
          tile.url = url;
          tile.icon = icon;
        }
      } else {
        tiles.push({ id: Date.now().toString(), name, url, icon });
      }

      renderGrid();
      closeModal();
      await syncToCloud();
    });

    btnDelete.addEventListener('click', async () => {
      const id = document.getElementById('tile-id').value;
      if (id && confirm('Weet je zeker dat je dit blokje wilt verwijderen?')) {
        tiles = tiles.filter(t => t.id !== id);
        renderGrid();
        closeModal();
        await syncToCloud();
      }
    });

    btnCancel.addEventListener('click', closeModal);

    loadTiles();
  </script>
</body>
</html>
