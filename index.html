<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startpagina</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1e293b;
      background-image: radial-gradient(circle at 50% 30%, #334155 0%, #0f172a 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 15px;
      color: #ffffff;
      transition: background 0.3s ease;
    }
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 650px;
      margin-bottom: 20px;
    }
    .search-form {
      display: flex;
      flex: 1;
      min-width: 240px;
      background: #ffffff;
      border-radius: 25px;
      padding: 4px 6px 4px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    .search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      color: #1e293b;
      background: transparent;
    }
    .search-button {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .user-select-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 6px 12px;
      backdrop-filter: blur(5px);
    }
    .user-select {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: 600;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    .user-select option {
      background: #1e293b;
      color: #fff;
    }
    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      backdrop-filter: blur(5px);
    }
    .action-btn:hover { background: rgba(255, 255, 255, 0.3); }
    .action-btn.active { background: #ef4444; border-color: #ef4444; }

    .welcome-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .webmix-board {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: fit-content;
      max-width: 100%;
      margin: 0 auto;
    }
    .tile-grid {
      display: grid;
      gap: 10px;
      justify-content: center;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 85px;
      height: 85px;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      text-decoration: none;
      color: #1e293b;
      padding: 8px 6px 6px 6px;
      position: relative;
      transition: transform 0.18s ease-in-out, box-shadow 0.18s ease-in-out;
      overflow: hidden;
      cursor: pointer;
      user-select: none;
    }
    .tile:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }
    .tile.dragging {
      opacity: 0.3;
      transform: scale(0.95);
    }
    .tile img {
      width: 32px;
      height: 32px;
      margin-bottom: 6px;
      object-fit: contain;
      pointer-events: none;
    }
    .tile span {
      font-size: 0.68rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.15;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #334155;
      pointer-events: none;
    }

    body.edit-mode .tile {
      animation: shake 0.3s infinite alternate;
      border: 2px dashed #3b82f6;
      cursor: grab;
    }
    body.edit-mode .tile:active { cursor: grabbing; }
    @keyframes shake {
      0% { transform: rotate(-1deg); }
      100% { transform: rotate(1deg); }
    }
    .add-tile {
      background: rgba(255, 255, 255, 0.15);
      border: 2px dashed rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 2rem;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1e293b;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .modal label {
      font-size: 0.8rem;
      color: #94a3b8;
      display: block;
      margin-bottom: 4px;
    }
    .modal input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }
    .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .btn-save { background: #22c55e; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin-right: auto; font-weight: 600; }
    .btn-cancel { background: #64748b; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <div class="top-bar">
    <form class="search-form" action="https://www.google.com/search" method="get" target="_blank">
      <input type="text" name="q" class="search-input" placeholder="Zoeken op Google..." aria-label="Zoeken">
      <button type="submit" class="search-button">Zoek</button>
    </form>
    
    <div class="user-select-wrap">
      <span>👤</span>
      <select id="user-select" class="user-select" title="Kies gebruiker"></select>
    </div>

    <button id="settings-btn" class="action-btn" style="display: none;">⚙️ Instellingen</button>
    <button id="toggle-edit" class="action-btn">✏️ Bewerken</button>
  </div>

  <h1 id="welcome-title" class="welcome-title"></h1>

  <main class="webmix-board">
    <nav class="tile-grid" id="tile-grid"></nav>
  </main>

  <!-- Modal voor blokje bewerken -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2 id="modal-title" style="margin-bottom: 15px;">Blokje Bewerken</h2>
      <form id="tile-form">
        <input type="hidden" id="tile-id">
        <label>Naam</label>
        <input type="text" id="tile-name" required placeholder="bijv. YouTube">
        <label>Link (URL)</label>
        <input type="url" id="tile-url" required placeholder="https://...">
        <label>Icoon URL (optioneel)</label>
        <input type="url" id="tile-icon" placeholder="https://.../icoon.png">
        <div class="modal-buttons">
          <button type="button" class="btn-delete" id="btn-delete">Verwijderen</button>
          <button type="button" class="btn-cancel" id="btn-cancel">Annuleren</button>
          <button type="submit" class="btn-save">Opslaan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal voor pagina instellingen -->
  <div class="modal-overlay" id="settings-modal-overlay">
    <div class="modal">
      <h2 style="margin-bottom: 15px;">Instellingen</h2>
      <form id="settings-form">
        <label>Welkomsttekst voor deze gebruiker</label>
        <input type="text" id="setting-welcome" placeholder="bijv. Welkom Piet!">
        <label>Achtergrond URL of kleurcode</label>
        <input type="text" id="setting-bg" placeholder="https://... of #1e293b">
        <label>Nieuwe collega/gebruiker toevoegen</label>
        <input type="text" id="setting-new-user" placeholder="Naam collega (optioneel)">
        <div class="modal-buttons">
          <button type="button" class="btn-cancel" id="btn-cancel-settings">Annuleren</button>
          <button type="submit" class="btn-save">Opslaan</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const BIN_ID = '6a8ef503da38895dfe137a34';
    const API_KEY = '$2a$10$I4Cx9aKKN/SuUjkhvCqzvO5bvMBZo3f3Elo2HgVWJQLgo0iix.wBq';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let cloudData = {
      users: ["Algemeen"],
      profiles: {
        "Algemeen": { settings: { welcomeText: '', bgUrl: '' }, tiles: [] }
      }
    };

    let currentUser = localStorage.getItem('startpage_active_user') || 'Algemeen';
    let isEditMode = false;
    let draggedIndex = null;
    let isDragging = false;

    const gridEl = document.getElementById('tile-grid');
    const welcomeTitleEl = document.getElementById('welcome-title');
    const toggleEditBtn = document.getElementById('toggle-edit');
    const settingsBtn = document.getElementById('settings-btn');
    const userSelectEl = document.getElementById('user-select');
    
    const modalOverlay = document.getElementById('modal-overlay');
    const tileForm = document.getElementById('tile-form');
    const btnCancel = document.getElementById('btn-cancel');
    const btnDelete = document.getElementById('btn-delete');

    const settingsModalOverlay = document.getElementById('settings-modal-overlay');
    const settingsForm = document.getElementById('settings-form');
    const btnCancelSettings = document.getElementById('btn-cancel-settings');

    async function loadData() {
      gridEl.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Laden...</p>';
      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { 'X-Master-Key': API_KEY }
        });
        const data = await res.json();
        const record = data.record;

        // Migratie van oude data structuur naar multi-user structuur
        if (record && record.profiles) {
          cloudData = record;
        } else {
          let oldTiles = record?.tiles || (Array.isArray(record) ? record : []);
          let oldSettings = record?.settings || { welcomeText: '', bgUrl: '' };
          cloudData = {
            users: ["Algemeen"],
            profiles: {
              "Algemeen": { settings: oldSettings, tiles: oldTiles }
            }
          };
        }

        if (!cloudData.users.includes(currentUser)) {
          currentUser = cloudData.users[0] || 'Algemeen';
          // Automatische schoning van te zware icoontjes
let isGecorrigeerd = false;
Object.keys(cloudData.profiles).forEach(u => {
  cloudData.profiles[u].tiles.forEach(t => {
    if (t.icon && t.icon.length > 500) {
      t.icon = ''; // Wist automatisch de te grote afbeelding
      isGecorrigeerd = true;
    }
  });
});

if (isGecorrigeerd) {
  syncToCloud();
}
        }

        renderUserDropdown();
        applyProfileAndRender();
      } catch (err) {
        gridEl.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Fout bij laden van data.</p>';
      }
    }

async function syncToCloud() {
  try {
    const res = await fetch(API_URL, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': API_KEY
      },
      body: JSON.stringify(cloudData)
    });

    if (!res.ok) {
      const errorData = await res.json();
      alert(`Opslaan mislukt! Foutcode ${res.status}: ${errorData.message || 'Geen rechten'}`);
    }
  } catch (err) {
    alert('Netwerkfout bij opslaan in de cloud!');
  }
}

    function renderUserDropdown() {
      userSelectEl.innerHTML = '';
      cloudData.users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.innerText = u;
        if (u === currentUser) opt.selected = true;
        userSelectEl.appendChild(opt);
      });
    }

    function getCurrentProfile() {
      if (!cloudData.profiles[currentUser]) {
        cloudData.profiles[currentUser] = { settings: { welcomeText: '', bgUrl: '' }, tiles: [] };
      }
      return cloudData.profiles[currentUser];
    }

    function applyProfileAndRender() {
      const profile = getCurrentProfile();
      const welcome = profile.settings?.welcomeText || '';
      const bg = profile.settings?.bgUrl || '';

      if (welcome.trim() !== '') {
        welcomeTitleEl.innerText = welcome;
        welcomeTitleEl.style.display = 'block';
      } else {
        welcomeTitleEl.style.display = 'none';
      }

      if (bg.trim() !== '') {
        if (bg.startsWith('http://') || bg.startsWith('https://') || bg.startsWith('data:image')) {
          document.body.style.backgroundImage = `url("${bg}")`;
        } else {
          document.body.style.background = bg;
        }
      } else {
        document.body.style.background = '#1e293b';
        document.body.style.backgroundImage = 'radial-gradient(circle at 50% 30%, #334155 0%, #0f172a 100%)';
      }

      renderGrid();
    }

    function updateGridColumns() {
      const profile = getCurrentProfile();
      const totalItems = profile.tiles.length + (isEditMode ? 1 : 0);
      if (totalItems === 0) return;

      const availableWidth = window.innerWidth - 60;
      const maxColsOnScreen = Math.max(1, Math.floor((availableWidth + 10) / 95));
      const idealSquareCols = Math.ceil(Math.sqrt(totalItems));
      const cols = Math.min(idealSquareCols, maxColsOnScreen);

      gridEl.style.gridTemplateColumns = `repeat(${cols}, 85px)`;
    }

    function renderGrid() {
      updateGridColumns();
      gridEl.innerHTML = '';
      const profile = getCurrentProfile();

      profile.tiles.forEach((tile, index) => {
        const a = document.createElement('a');
        a.className = 'tile';
        a.href = tile.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.draggable = isEditMode;
        
        const iconUrl = tile.icon || `https://www.google.com/s2/favicons?domain=${tile.url}&sz=64`;
        a.innerHTML = `<img src="${iconUrl}" alt="" loading="lazy"><span>${tile.name}</span>`;

        a.addEventListener('dragstart', (e) => {
          if (!isEditMode) return;
          draggedIndex = index;
          isDragging = true;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => a.classList.add('dragging'), 0);
        });

        a.addEventListener('dragover', (e) => {
          if (!isEditMode) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
        });

        a.addEventListener('drop', async (e) => {
          if (!isEditMode) return;
          e.preventDefault();
          if (draggedIndex !== null && draggedIndex !== index) {
            const movedItem = profile.tiles.splice(draggedIndex, 1)[0];
            profile.tiles.splice(index, 0, movedItem);
            renderGrid();
            await syncToCloud();
          }
        });

        a.addEventListener('dragend', () => {
          a.classList.remove('dragging');
          draggedIndex = null;
          setTimeout(() => { isDragging = false; }, 50);
        });

        a.addEventListener('click', (e) => {
          if (isEditMode) {
            e.preventDefault();
            if (!isDragging) {
              openModal(tile);
            }
          }
        });

        gridEl.appendChild(a);
      });

      if (isEditMode) {
        const addBtn = document.createElement('div');
        addBtn.className = 'tile add-tile';
        addBtn.innerText = '+';
        addBtn.addEventListener('click', () => openModal());
        gridEl.appendChild(addBtn);
      }
    }

    userSelectEl.addEventListener('change', (e) => {
      currentUser = e.target.value;
      localStorage.setItem('startpage_active_user', currentUser);
      applyProfileAndRender();
    });

    function openModal(tile = null) {
      modalOverlay.classList.add('open');
      if (tile) {
        document.getElementById('modal-title').innerText = 'Blokje Bewerken';
        document.getElementById('tile-id').value = tile.id;
        document.getElementById('tile-name').value = tile.name;
        document.getElementById('tile-url').value = tile.url;
        document.getElementById('tile-icon').value = tile.icon || '';
        btnDelete.style.display = 'block';
      } else {
        document.getElementById('modal-title').innerText = 'Nieuw Blokje';
        document.getElementById('tile-id').value = '';
        tileForm.reset();
        btnDelete.style.display = 'none';
      }
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      tileForm.reset();
    }

    toggleEditBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      document.body.classList.toggle('edit-mode', isEditMode);
      toggleEditBtn.classList.toggle('active', isEditMode);
      toggleEditBtn.innerText = isEditMode ? '✖️ Klaar' : '✏️ Bewerken';
      settingsBtn.style.display = isEditMode ? 'inline-block' : 'none';
      renderGrid();
    });

    settingsBtn.addEventListener('click', () => {
      const profile = getCurrentProfile();
      document.getElementById('setting-welcome').value = profile.settings?.welcomeText || '';
      document.getElementById('setting-bg').value = profile.settings?.bgUrl || '';
      document.getElementById('setting-new-user').value = '';
      settingsModalOverlay.classList.add('open');
    });

    btnCancelSettings.addEventListener('click', () => {
      settingsModalOverlay.classList.remove('open');
    });

    settingsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const profile = getCurrentProfile();
      profile.settings = {
        welcomeText: document.getElementById('setting-welcome').value,
        bgUrl: document.getElementById('setting-bg').value
      };

      const newUserInput = document.getElementById('setting-new-user').value.trim();
      if (newUserInput !== '') {
        if (!cloudData.users.includes(newUserInput)) {
          cloudData.users.push(newUserInput);
          // Kopieer bestaande blokjes als startpunt voor de nieuwe gebruiker
          cloudData.profiles[newUserInput] = {
            settings: { welcomeText: `Welkom ${newUserInput}!`, bgUrl: '' },
            tiles: JSON.parse(JSON.stringify(profile.tiles))
          };
          currentUser = newUserInput;
          localStorage.setItem('startpage_active_user', currentUser);
          renderUserDropdown();
        }
      }

      applyProfileAndRender();
      settingsModalOverlay.classList.remove('open');
      await syncToCloud();
    });

    tileForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const profile = getCurrentProfile();
      const id = document.getElementById('tile-id').value;
      const name = document.getElementById('tile-name').value;
      const url = document.getElementById('tile-url').value;
      const icon = document.getElementById('tile-icon').value;

      if (id) {
        const tile = profile.tiles.find(t => t.id === id);
        if (tile) {
          tile.name = name;
          tile.url = url;
          tile.icon = icon;
        }
      } else {
        profile.tiles.push({ id: Date.now().toString(), name, url, icon });
      }

      renderGrid();
      closeModal();
      await syncToCloud();
    });

    btnDelete.addEventListener('click', async () => {
      const profile = getCurrentProfile();
      const id = document.getElementById('tile-id').value;
      if (id && confirm('Weet je zeker dat je dit blokje wilt verwijderen?')) {
        profile.tiles = profile.tiles.filter(t => t.id !== id);
        renderGrid();
        closeModal();
        await syncToCloud();
      }
    });

    btnCancel.addEventListener('click', closeModal);
    window.addEventListener('resize', updateGridColumns);

    loadData();
  </script>
</body>
</html>
